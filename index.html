<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Alchemy Souls: Collectors Edition</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #ffffff; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        h1 { margin: 10px 0 2px 0; text-align: center; font-size: 22px; letter-spacing: 1px; }
        p { margin: 0 0 10px 0; text-align: center; color: #888; font-size: 13px; }
        
        .game-container { display: flex; flex: 1; height: calc(100vh - 60px); position: relative; }
        #workspace { flex: 1; background: #1a1a1a; position: relative; overflow: hidden; border-right: 3px solid #252525; }
        #workspace::before { content: "Перетащите элементы сюда"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #2a2a2a; font-size: 24px; font-weight: bold; pointer-events: none; z-index: 0; }
        
        /* Боковая панель */
        #sidebar { width: 300px; background: #1e1e1e; display: flex; flex-direction: column; box-shadow: -4px 0 15px rgba(0,0,0,0.7); }
        .sidebar-header { padding: 15px 10px 5px 10px; border-bottom: 2px solid #2a2a2a; text-align: center; }
        #search-box { width: 90%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #121212; color: #fff; font-size: 14px; outline: none; margin-bottom: 10px; }
        #search-box:focus { border-color: #00ffd2; }
        
        /* Кнопки вкладок */
        .tabs-container { display: flex; background: #151515; border-bottom: 2px solid #2a2a2a; }
        .tab-btn { flex: 1; background: none; border: none; color: #888; padding: 12px 5px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s; outline: none; text-align: center; }
        .tab-btn:hover { color: #fff; background: #252525; }
        .tab-btn.active { color: #00ffd2; border-bottom: 2px solid #00ffd2; background: #1e1e1e; }
        
        /* Списки инвентаря */
        .tab-content { flex: 1; overflow-y: auto; padding: 10px; display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; align-content: start; }
        .tab-content.active { display: grid; }
        
        /* Особый стиль для вкладки достижений (в одну колонку) */
        #achievements-tab { grid-template-columns: 1fr; }
        
        /* Стили кнопок управления */
        .controls-container { display: flex; justify-content: center; gap: 5px; padding-bottom: 5px; }
        .clear-desk-btn { background: #00ffd2; color: #121212; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; }
        .clear-desk-btn:hover { background: #00cca8; }
        .reset-btn { background: #ff4a4a; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; }
        .reset-btn:hover { background: #cc3333; }

        /* Стили элементов */
        .item { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 100px; height: 110px; background: #262626; border: 2px solid #383838; border-radius: 8px; cursor: grab; user-select: none; z-index: 1; margin: auto; }
        .item:hover { border-color: #555; background: #2d2d2d; }
        .item img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 6px; pointer-events: none; background: rgba(0,0,0,0.3); border-radius: 4px; }
        .item span { font-size: 11px; font-weight: bold; text-align: center; padding: 0 4px; pointer-events: none; word-break: break-word; }
        .item.on-desk { position: absolute; z-index: 10; margin: 0; background: #2d2d2d; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        /* Стиль для элементов, которые больше нигде не используются */
        .item.dead-end {border-color: #444444; background: #1c1c1c; color: #666666; }
        .item.dead-end img {opacity: 0.4; 
        /* Картинка становится полупрозрачной */
}
        
        /* Карточка художника (Особый стиль во вкладке Художники) */
        .item.artist-card { border-color: #00ffd2; box-shadow: inset 0 0 10px rgba(0,255,210,0.1); cursor: pointer; }
        .item.artist-card:hover { box-shadow: 0 0 10px rgba(0,255,210,0.3); border-color: #00ffd2; }

        /* Стили карточек достижений */
        .ach-card { background: #151515; border: 1px solid #333; padding: 12px; border-radius: 8px; display: flex; align-items: center; gap: 12px; opacity: 0.4; transition: 0.3s; }
        .ach-card.unlocked { opacity: 1; border-color: #ff007f; box-shadow: 0 0 10px rgba(255,0,127,0.1); }
        .ach-icon { font-size: 24px; background: #222; padding: 8px; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 1px solid #333; }
        .ach-card.unlocked .ach-icon { border-color: #ff007f; color: #ff007f; background: rgba(255,0,127,0.05); }
        .ach-info { text-align: left; }
        .ach-title { font-weight: bold; font-size: 14px; margin-bottom: 2px; color: #fff; }
        .ach-card.unlocked .ach-title { color: #ff007f; }
        .ach-desc { font-size: 11px; color: #888; }
        .ach-reward-tag { font-size: 10px; color: #00ffd2; margin-top: 4px; display: inline-block; font-weight: bold; }

        /* Всплывающее окно художника (Модалка) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: #1e1e1e; padding: 25px; border-radius: 16px; max-width: 450px; width: 90%; text-align: center; border: 2px solid #00ffd2; box-shadow: 0 0 25px rgba(0, 255, 210, 0.2); position: relative; transform: scale(0.8); transition: transform 0.3s ease; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-art { width: 100%; max-height: 280px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; background: #121212; }
        .modal-name { font-size: 24px; font-weight: bold; margin: 10px 0; color: #fff; }
        .modal-desc { color: #aaa; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        .modal-link { display: inline-block; background: #00ffd2; color: #121212; text-decoration: none; padding: 12px 30px; border-radius: 30px; font-weight: bold; font-size: 16px; transition: 0.2s; box-shadow: 0 4px 15px rgba(0, 255, 210, 0.4); }
        .modal-link:hover { background: #00cca8; transform: translateY(-2px); }
        .close-modal { position: absolute; top: 12px; right: 15px; color: #888; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .close-modal:hover { color: #fff; }
        
        /* Всплывающее уведомление о достижении */
        .achievement-toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: #1e1e1e; border: 2px solid #ff007f; box-shadow: 0 0 20px rgba(255, 0, 127, 0.4); color: white; padding: 15px 30px; border-radius: 50px; font-weight: bold; z-index: 2000; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 10px; }
        .achievement-toast.show { bottom: 30px; }
        .achievement-toast .icon { font-size: 20px; color: #ff007f; }
        .achievement-toast .reward { color: #00ffd2; }
    </style>
</head>
<body>
    <h1>Alchemy Souls: Artists Edition</h1>
    <p>Соединяйте смыслы и концепты, чтобы открыть портфолио потрясающих художников!</p>
    
    <div class="game-container">
        <div id="workspace"></div>
        
        <div id="sidebar">
            <div class="sidebar-header">
                <input type="text" id="search-box" placeholder="Поиск в текущей вкладке...">
                <div class="controls-container">
                    <button class="clear-desk-btn" onclick="clearDesk()">Очистить стол</button>
                    <button class="reset-btn" onclick="resetGame()">Сброс</button>
                </div>
            </div>
            
            <!-- Кнопки переключения вкладок -->
            <div class="tabs-container">
                <button class="tab-btn active" onclick="switchTab('items')">Элементы</button>
                <button class="tab-btn" onclick="switchTab('artists')">Художники</button>
                <button class="tab-btn" onclick="switchTab('achievements')">Достижения</button>
            </div>
            
            <!-- Списки инвентаря под каждую вкладку -->
            <div id="items-tab" class="tab-content active"></div>
            <div id="artists-tab" class="tab-content"></div>
            <div id="achievements-tab" class="tab-content"></div>
        </div>
    </div>
    
    <!-- Модальное окно -->
    <div class="modal-overlay" id="artist-modal" onclick="closeModal(event)">
        <div class="modal-content">
            <span class="close-modal" onclick="document.getElementById('artist-modal').classList.remove('active')">&times;</span>
            <img src="" alt="Art" class="modal-art" id="m-art">
            <div class="modal-name" id="m-name">Имя Художника</div>
            <div class="modal-desc" id="m-desc">Описание или ключевые стили автора.</div>
            <a href="#" target="_blank" class="modal-link" id="m-link">Смотреть Портфолио</a>
        </div>
    </div>
    
    <!-- Тост достижений -->
    <div class="achievement-toast" id="achievement-popup">
        <span class="icon">🏆</span>
        <span>Достижение! Получен элемент: <span class="reward" id="ach-reward">???</span></span>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
